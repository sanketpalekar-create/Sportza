# Sportza API — Railway service config
# In Railway: Settings → Build → set "Custom Dockerfile path" to apps/api/Dockerfile
# Root Directory: leave as repo root (Dockerfile context is monorepo root)

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/**", "pnpm-lock.yaml", "package.json"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
